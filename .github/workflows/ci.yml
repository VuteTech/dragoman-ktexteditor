#
# Every push to master and every pull request. The release workflow also
# calls it on the tagged commit before anything reaches OBS; this workflow
# itself never publishes anything.
#
# The builds run in distribution containers, because the Ubuntu runners do
# not ship KF6: Debian 13 carries the oldest supported KF6 and Qt, Fedora 44
# the newest, and Debian 13 also runs on a native ARM64 runner.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: "Commit or tag to test (empty: the triggering commit)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  checks:
    name: checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - name: REUSE compliance
        run: pipx run reuse lint
      - name: Scripts are executable
        run: |
          # Every tracked file with a #! line must be committed as 100755.
          bad=0
          while IFS= read -r file; do
            mode="$(git ls-files -s -- "$file" | cut -d' ' -f1)"
            if [ "$mode" != 100755 ]; then
              echo "::error file=$file::has a #! line but is committed as $mode, not 100755"
              bad=1
            fi
          done < <(git ls-files | while IFS= read -r f; do
            [ -f "$f" ] && head -c2 "$f" | grep -q '^#!' && echo "$f"
          done)
          exit "$bad"
      - name: shellcheck
        run: git ls-files -z -- '*.sh' | xargs -0 shellcheck

  build:
    name: build and test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debian 13, x86-64
            image: docker.io/library/debian:13
            runner: ubuntu-24.04
            family: debian
          - name: Debian 13, ARM64
            image: docker.io/library/debian:13
            runner: ubuntu-24.04-arm
            family: debian
          - name: Fedora 44, x86-64
            image: registry.fedoraproject.org/fedora:44
            runner: ubuntu-24.04
            family: fedora
            format: true
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    steps:
      # Before the checkout, so that it gets a real git history, which the
      # build takes its version from.
      - name: Install build dependencies (Debian)
        if: matrix.family == 'debian'
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git cmake ninja-build g++ gettext extra-cmake-modules \
            qt6-base-dev libkf6config-dev libkf6coreaddons-dev libkf6i18n-dev \
            libkf6texteditor-dev libkf6xmlgui-dev appstream dbus-daemon
      - name: Install build dependencies (Fedora)
        if: matrix.family == 'fedora'
        run: |
          dnf install -y git cmake ninja-build gcc-c++ gettext extra-cmake-modules \
            'cmake(Qt6Core)' 'cmake(Qt6DBus)' 'cmake(Qt6Gui)' 'cmake(Qt6Widgets)' 'cmake(Qt6Test)' \
            'cmake(KF6Config)' 'cmake(KF6CoreAddons)' 'cmake(KF6I18n)' 'cmake(KF6TextEditor)' 'cmake(KF6XmlGui)' \
            appstream dbus-daemon clang-tools-extra
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - name: Build and install libdragoman-qt
        run: |
          git clone --depth 1 https://github.com/VuteTech/libdragoman-qt.git /tmp/libdragoman-qt
          cmake -S /tmp/libdragoman-qt -B /tmp/libdragoman-qt/build -G Ninja -DBUILD_TESTING=OFF -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build /tmp/libdragoman-qt/build
          cmake --install /tmp/libdragoman-qt/build
      - name: Configure
        run: |
          git config --global --add safe.directory "$PWD"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTING=ON -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Code style (clang-format, KDE style from ECM)
        if: matrix.format
        run: |
          # .clang-format was generated by the configure step.
          git ls-files -z -- '*.cpp' '*.h' | xargs -0 clang-format --dry-run --Werror
